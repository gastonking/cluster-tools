<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCP 3.0 Node Status Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-6 font-sans">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="flex justify-between items-center bg-gray-900 border border-gray-800 p-5 rounded-xl shadow-lg">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">OpenShift 3.x Cluster Dashboard</h1>
                <p class="text-xs text-gray-400 mt-1">Estado en tiempo real de los nodos del cluster</p>
            </div>
            <div id="cluster-badge" class="px-4 py-2 rounded-lg font-bold text-sm uppercase tracking-wider bg-gray-800 text-gray-400">
                Cargando...
            </div>
        </div>

        <!-- Metrics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-gray-900 border border-gray-800 p-5 rounded-xl">
                <p class="text-sm font-medium text-gray-400">Total Nodos</p>
                <p id="total-nodes" class="text-3xl font-extrabold text-white mt-2">-</p>
            </div>
            <div class="bg-gray-900 border border-gray-800 p-5 rounded-xl">
                <p class="text-sm font-medium text-gray-400">Nodos Ready</p>
                <p id="ready-nodes" class="text-3xl font-extrabold text-emerald-400 mt-2">-</p>
            </div>
            <div class="bg-gray-900 border border-gray-800 p-5 rounded-xl">
                <p class="text-sm font-medium text-gray-400">Nodos Inoperativos / Advertencias</p>
                <p id="issue-nodes" class="text-3xl font-extrabold text-rose-500 mt-2">-</p>
            </div>
        </div>

        <!-- Nodes Table -->
        <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden shadow-lg">
            <div class="px-6 py-4 border-b border-gray-800 flex justify-between items-center">
                <h2 class="text-lg font-semibold text-white">Detalle por Nodo</h2>
                <span id="last-update" class="text-xs text-gray-500">Última actualización: --:--:--</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-300">
                    <thead class="bg-gray-950 text-gray-400 uppercase text-xs">
                        <tr>
                            <th class="px-6 py-3">Nombre</th>
                            <th class="px-6 py-3">Rol</th>
                            <th class="px-6 py-3">Estado</th>
                            <th class="px-6 py-3">Scheduling</th>
                            <th class="px-6 py-3">Alertas Condición</th>
                            <th class="px-6 py-3">Versión Kubelet</th>
                        </tr>
                    </thead>
                    <tbody id="nodes-table-body" class="divide-y divide-gray-800">
                        <tr>
                            <td colspan="6" class="px-6 py-4 text-center text-gray-500">Obteniendo datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        async function fetchDashboardData() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                if (data.error) {
                    renderError(data.error);
                    return;
                }

                // Update Metrics
                document.getElementById('total-nodes').innerText = data.total_nodes;
                document.getElementById('ready-nodes').innerText = data.ready_nodes;
                document.getElementById('issue-nodes').innerText = data.total_nodes - data.ready_nodes;

                // Update Cluster Badge
                const badge = document.getElementById('cluster-badge');
                if (data.cluster_status === 'HEALTHY') {
                    badge.className = "px-4 py-2 rounded-lg font-bold text-sm uppercase tracking-wider bg-emerald-950 text-emerald-400 border border-emerald-800";
                    badge.innerText = "Cluster OK";
                } else if (data.cluster_status === 'WARNING') {
                    badge.className = "px-4 py-2 rounded-lg font-bold text-sm uppercase tracking-wider bg-amber-950 text-amber-400 border border-amber-800";
                    badge.innerText = "Degradado";
                } else {
                    badge.className = "px-4 py-2 rounded-lg font-bold text-sm uppercase tracking-wider bg-rose-950 text-rose-400 border border-rose-800";
                    badge.innerText = "Crítico";
                }

                // Update Table
                const tbody = document.getElementById('nodes-table-body');
                tbody.innerHTML = '';

                data.nodes.forEach(node => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-800/50 transition-colors";

                    const statusBadge = node.status === 'Ready'
                        ? `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-950 text-emerald-400 border border-emerald-800">Ready</span>`
                        : `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-950 text-rose-400 border border-rose-800">NotReady</span>`;

                    const schedBadge = node.unschedulable
                        ? `<span class="text-amber-400 text-xs font-medium">SchedulingDisabled</span>`
                        : `<span class="text-gray-400 text-xs">Active</span>`;

                    const issuesText = node.issues.length > 0
                        ? `<span class="text-rose-400 font-medium">${node.issues.join(', ')}</span>`
                        : `<span class="text-gray-600">-</span>`;

                    tr.innerHTML = `
                        <td class="px-6 py-4 font-mono text-xs font-semibold text-white">${node.name}</td>
                        <td class="px-6 py-4"><span class="px-2 py-0.5 rounded bg-gray-800 text-gray-300 text-xs">${node.role}</span></td>
                        <td class="px-6 py-4">${statusBadge}</td>
                        <td class="px-6 py-4">${schedBadge}</td>
                        <td class="px-6 py-4">${issuesText}</td>
                        <td class="px-6 py-4 font-mono text-xs text-gray-400">${node.kubelet_version}</td>
                    `;
                    tbody.appendChild(tr);
                });

                document.getElementById('last-update').innerText = `Última actualización: ${new Date().toLocaleTimeString()}`;

            } catch (err) {
                renderError("Error al conectar con la API interna del dashboard");
            }
        }

        function renderError(msg) {
            const badge = document.getElementById('cluster-badge');
            badge.className = "px-4 py-2 rounded-lg font-bold text-sm uppercase tracking-wider bg-gray-800 text-rose-400 border border-rose-800";
            badge.innerText = "Error API";

            const tbody = document.getElementById('nodes-table-body');
            tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-4 text-center text-rose-400">${msg}</td></tr>`;
        }

        fetchDashboardData();
        setInterval(fetchDashboardData, 10000); // Refresco cada 10s
    </script>
</body>
</html>
